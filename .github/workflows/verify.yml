name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned so a push to a sibling repository cannot change what this run builds;
      # bump together with the package versions the adapters are packed against.
      - name: Idiomatic layer
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/BindingIdiomatic
          path: Binding.Idiomatic
          ref: 61e80e0

      - name: ABI contract
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/BindingAbi
          path: Binding.Abi
          ref: 5b8d95f

      - name: Endstone Interop
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/EndstoneBinding
          path: Binding.Endstone
          ref: 671abdd

      - name: LeviLamina Interop
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/LeviLaminaBinding
          path: Binding.LeviLamina
          ref: 6b8ec426

      - name: Plugin Abstractions
        uses: actions/checkout@v4
        with:
          repository: HosihikariFramework/PluginAbstractions
          path: Plugin.Abstractions
          ref: 2e2c8fc1d794bb3ba78f73b3f90fbe338f5a0a30

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: >
          dotnet build Hosihikari.Extension.slnx -c Release
          -p:PluginAbstractionsProjectPath=${{ github.workspace }}/Plugin.Abstractions/src/Hosihikari.Plugin.Abstractions.csproj
          -p:LeviLaminaIdiomaticProjectPath=${{ github.workspace }}/Binding.Idiomatic/src/Hosihikari.Binding.LeviLamina/Hosihikari.Binding.LeviLamina.csproj
          -p:EndstoneIdiomaticProjectPath=${{ github.workspace }}/Binding.Idiomatic/src/Hosihikari.Binding.Endstone/Hosihikari.Binding.Endstone.csproj
          -p:AbiProjectPath=${{ github.workspace }}/Binding.Abi/src/Hosihikari.Binding.Abi/Hosihikari.Binding.Abi.csproj
          -p:EndstoneInteropProjectPath=${{ github.workspace }}/Binding.Endstone/src/Hosihikari.Binding.Endstone.Interop/Hosihikari.Binding.Endstone.Interop.csproj
          -p:LeviLaminaInteropProjectPath=${{ github.workspace }}/Binding.LeviLamina/src/Hosihikari.Binding.LeviLamina.Interop/Hosihikari.Binding.LeviLamina.Interop.csproj

      - name: Test
        run: dotnet run --project tests/Hosihikari.Extension.Tests/Hosihikari.Extension.Tests.csproj -c Release
